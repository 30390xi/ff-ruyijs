name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m compileall -q python/ruyijs ci
      - name: pyflakes
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes python/ruyijs ci

  smoke:
    name: Smoke test (Windows, Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The native runtime ships only in the wheel, so the published package is
      # what gets exercised; the test runs offline (no network access needed).
      - name: Install ruyijs
        run: python -m pip install --quiet ruyijs
      - name: Run smoke test
        run: python ci/smoke_test.py

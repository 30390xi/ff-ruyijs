[package]
name = "necko_quic"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
neqo-common = { path = "../../../firefox-159/third_party/rust/neqo-common" }
neqo-http3 = { path = "../../../firefox-159/third_party/rust/neqo-http3" }
neqo-transport = { path = "../../../firefox-159/third_party/rust/neqo-transport" }
nss = { package = "nss-rs", path = "../../../firefox-159/third_party/rust/nss-rs" }
serde_json = "1"
libc = "0.2"

[patch.crates-io]
# The build system doesn't want those to be used, but they are pulled anyways (because
# dependencies can't be disabled based on features), but remain unused. We ensure they
# stay unused by overriding them with crates that contain enough to build the current
# code and will fail the build in unwanted cases.
cmake = { path = "../../../firefox-159/build/rust/cmake" }
vcpkg = { path = "../../../firefox-159/build/rust/vcpkg" }

# Helper crate for integration in the gecko build system.
mozbuild = { path = "../../../firefox-159/build/rust/mozbuild" }

# Workspace hack
mozilla-central-workspace-hack = { path = "../../../firefox-159/build/workspace-hack" }

# windows-targets replacement. It avoids the large dependencies of the original
# crate, which we don't really need as we require MSVC anyways.
windows-targets = { path = "../../../firefox-159/build/rust/windows-targets" }

# Patch windows to use a non-vendored local copy of the crate.
windows = { path = "../../../firefox-159/build/rust/windows" }

# Dummy oslog replacement. It's only used by glean in code that is not actually used.
oslog = { path = "../../../firefox-159/build/rust/oslog" }

# Override terminal_size with a dummy crate that returns a fixed 80x25 terminal size.
terminal_size = { path = "../../../firefox-159/build/rust/terminal_size" }

# Patch bitflags 1.0 to 2.0
bitflags = { path = "../../../firefox-159/build/rust/bitflags" }

# Patch r-efi to an empty crate
r-efi = { path = "../../../firefox-159/build/rust/r-efi" }

# Patch redox_users to an empty crate
redox_users = { path = "../../../firefox-159/build/rust/redox_users" }

# Patch redox_syscall to an empty crate
redox_syscall = { path = "../../../firefox-159/build/rust/redox_syscall" }

# Patch hermit-abi to an empty crate
hermit-abi = { path = "../../../firefox-159/build/rust/hermit-abi" }

# mls-rs pulls these in unconditionally (or for non-Gecko targets), but their
# code paths are gated on `cfg(not(feature = "std"))` or
# `cfg(not(target_has_atomic = "ptr"))`, neither of which Gecko ever hits.
spin = { path = "../../../firefox-159/build/rust/spin" }
portable-atomic = { path = "../../../firefox-159/build/rust/portable-atomic" }
portable-atomic-util = { path = "../../../firefox-159/build/rust/portable-atomic-util" }

# Patch base64 0.21 to 0.22
base64_21 = { package = "base64", path = "../../../firefox-159/build/rust/base64" }

# Patch wasi 0.11 to 0.14
wasi_0_11 = { package = "wasi", path = "../../../firefox-159/build/rust/wasi" }

# Patch itertools 0.13 to 0.15
itertools_0_13 = { package = "itertools", path = "../../../firefox-159/build/rust/itertools-0.13" }

# Patch itertools 0.14 to 0.15
itertools_0_14 = { package = "itertools", path = "../../../firefox-159/build/rust/itertools" }

# tokio 0.29.0 includes an experimental "tracing" feature which requires
# backtrace ^0.3.58 and the `tokio_unstable` flag. We don't use it, and nothing
# else we do use requires backtrace, so dummy it out for now.
backtrace = { path = "../../../firefox-159/build/rust/backtrace" }

# Patch bindgen 0.72 to 0.73
bindgen = { package = "bindgen", path = "../../../firefox-159/build/rust/bindgen" }

# Locally patch icu_normalizer to take fixes from the 2.3 track
icu_collator = { path = "../../../firefox-159/third_party/rust/icu_collator" }
icu_collator_data = { path = "../../../firefox-159/third_party/rust/icu_collator_data" }
icu_normalizer = { path = "../../../firefox-159/third_party/rust/icu_normalizer" }
icu_normalizer_data = { path = "../../../firefox-159/third_party/rust/icu_normalizer_data" }
icu_collections = { path = "../../../firefox-159/third_party/rust/icu_collections" }
utf8_iter = { path = "../../../firefox-159/third_party/rust/utf8_iter" }
utf16_iter = { path = "../../../firefox-159/third_party/rust/utf16_iter" }
icu_properties = { path = "../../../firefox-159/third_party/rust/icu_properties" }
icu_properties_data = { path = "../../../firefox-159/third_party/rust/icu_properties_data" }

# Patch autocfg to hide rustc output. Workaround for https://github.com/cuviper/autocfg/issues/30
autocfg = { path = "../../../firefox-159/third_party/rust/autocfg" }

# Patch cc to fix https://github.com/rust-lang/cc-rs/issues/1883
# See also https://github.com/rust-lang/cc-rs/pull/1884
cc = { path = "../../../firefox-159/third_party/rust/cc" }

# Patch goblin 0.7.0 to 0.8
goblin = { path = "../../../firefox-159/build/rust/goblin" }

# Implement getrandom 0.2 in terms of 0.3
getrandom = { path = "../../../firefox-159/build/rust/getrandom" }

# Implement procfs-core 0.17.0 in terms of 0.18.0
procfs-core = { path = "../../../firefox-159/build/rust/procfs-core" }

# Patch rustc-hash 1.1.0 to 2.1.1
rustc-hash = { path = "../../../firefox-159/build/rust/rustc-hash" }


# Patch `hashbrown` 0.13.* to depend on 0.15.*
hashbrown_0_13 = { package = "hashbrown", path = "../../../firefox-159/build/rust/hashbrown-0.13" }

# Patch `hashbrown` 0.14.* to depend on 0.15.*
hashbrown_0_14 = { package = "hashbrown", path = "../../../firefox-159/build/rust/hashbrown-0.14" }

# Patch `hashbrown` 0.15.* to depend on 0.16.*
hashbrown_0_15 = { package = "hashbrown", path = "../../../firefox-159/build/rust/hashbrown-0.15" }

# Patch `hashbrown` 0.16.* to depend on 0.17.*
hashbrown_0_16 = { package = "hashbrown", path = "../../../firefox-159/build/rust/hashbrown" }

# Patch `hashlink` 0.10.* to 0.11.*
# This technically breaks `hashbrown::DefaultHashBuilder: Copy`, but it's not something we use.
hashlink = { path = "../../../firefox-159/build/rust/hashlink" }

# Patch `thiserror` 1 to 2.
thiserror = { path = "../../../firefox-159/build/rust/thiserror" }

# Patch `toml` 0.5 to 0.9
toml_0_5 = { package = "toml", path = "../../../firefox-159/build/rust/toml-0.5" }
toml_0_9 = { package = "toml", path = "../../../firefox-159/build/rust/toml" }

# The following overrides point to dummy projects, as a temporary measure until this is resolved:
# https://github.com/rust-lang/cargo/issues/6179
js-sys = { path = "../../../firefox-159/build/rust/dummy-web/js-sys" }
wasm-bindgen = { path = "../../../firefox-159/build/rust/dummy-web/wasm-bindgen" }
web-sys = { path = "../../../firefox-159/build/rust/dummy-web/web-sys" }


# Upgrade `core-foundation` 0.9.* to 0.10.
core-foundation = { path = "../../../firefox-159/build/rust/core-foundation" }
# Patch `core-graphics-types` 0.1.* to 0.2.
core-graphics-types = { path = "../../../firefox-159/build/rust/core-graphics-types" }
# Patch `dispatch2` to an empty crate that cannot be built.
dispatch2 = { path = "../../../firefox-159/build/rust/dispatch2" }

# Upgrade `rusqlite` 0.31 to 0.33.
rusqlite = { path = "../../../firefox-159/build/rust/rusqlite" }

# Overrides to allow easier use of common internal crates.
moz_asserts = { path = "../../../firefox-159/mozglue/static/rust/moz_asserts" }

# Patch `rure` to disable building the cdylib and staticlib targets
# Cargo has no way to disable building targets your dependencies provide which
# you don't depend on, and linking the cdylib breaks during instrumentation
# builds.
# Workaround for https://github.com/rust-lang/cargo/issues/11232
rure = { path = "../../../firefox-159/third_party/rust/rure" }

# Patch zlib-rs to test a workaround for crashes on Intel Raptor Lake CPU.
zlib-rs = { path = "../../../firefox-159/third_party/rust/zlib-rs" }

# To-be-published changes.


# Other overrides
firefox-on-glean = { path = "../../../firefox-159/toolkit/components/glean/api" }
icu_capi = { path = "../../../firefox-159/intl/icu_capi" }
icu_segmenter_data = { path = "../../../firefox-159/intl/icu_segmenter_data" }
libudev-sys = { path = "../../../firefox-159/dom/webauthn/libudev-sys" }
# Allow webrender to have a versioned dependency on the older crate on crates.io
# in order to build standalone.
malloc_size_of_derive = { path = "../../../firefox-159/xpcom/rust/malloc_size_of_derive" }
# Use the in-tree code instead of pulling it in. It matches the crates.io version
wr_malloc_size_of = { path = "../../../firefox-159/gfx/wr/wr_malloc_size_of" }
# Remove HarfBuzz itself from harfbuzz-sys, since we already maintain HarfBuzz itself in the tree.
# Make `harfbuzz` compile for targets with unsigned C char, such as aarch64 Android.
# Also vendor `harfbuzz-traits` to keep cargo-vendor happy.
# Fix https://github.com/rusticstuff/simdutf8/issues/129

# objc 0.2.7 + fa7ca43b862861dd1cd000d7ad01e6e0266cda13

# allocator-api2 + f95e3419ce41883904fcb2279b52aa35b5f04d76 + fdd92751afa7ce34408b677004b429d597e72c90

# application-services overrides to make updating them all simpler.
ads-client = { path = "../../../firefox-159/third_party/application-services/components/ads-client" }
context_id = { path = "../../../firefox-159/third_party/application-services/components/context_id" }
error-support = { path = "../../../firefox-159/third_party/application-services/components/support/error" }
filter_adult = { path = "../../../firefox-159/third_party/application-services/components/filter_adult" }
interrupt-support = { path = "../../../firefox-159/third_party/application-services/components/support/interrupt" }
relevancy = { path = "../../../firefox-159/third_party/application-services/components/relevancy" }
search = { path = "../../../firefox-159/third_party/application-services/components/search" }
sql-support = { path = "../../../firefox-159/third_party/application-services/components/support/sql" }
suggest = { path = "../../../firefox-159/third_party/application-services/components/suggest" }
sync15 = { path = "../../../firefox-159/third_party/application-services/components/sync15" }
tabs = { path = "../../../firefox-159/third_party/application-services/components/tabs" }
tracing-support = { path = "../../../firefox-159/third_party/application-services/components/support/tracing" }
viaduct = { path = "../../../firefox-159/third_party/application-services/components/viaduct" }
webext-storage = { path = "../../../firefox-159/third_party/application-services/components/webext-storage" }
logins = { path = "../../../firefox-159/third_party/application-services/components/logins" }
autofill = { path = "../../../firefox-159/third_party/application-services/components/autofill" }
init_rust_components = { path = "../../../firefox-159/third_party/application-services/components/init_rust_components" }
breach-alerts = { path = "../../../firefox-159/third_party/application-services/components/breach-alerts" }
db-crypto = { path = "../../../firefox-159/third_party/application-services/components/support/db-crypto" }
fxcontainers = { path = "../../../firefox-159/third_party/application-services/components/fxcontainers" }
# temporary ohttp override enabling app-services build-related hacks while we wait for a new version.

# Patched version of zip 2.4.2 to allow for reading omnijars.
zip = { path = "../../../firefox-159/third_party/rust/zip" }

# Unpublished changes

# Patch libcrux-traits to avoid unnecessary unused dependencies and conflicts.
libcrux-traits = { path = "../../../firefox-159/build/rust/libcrux-traits" }

# Patch libdbus-sys to avoid vendoring unnecessary massive libdbus source.
libdbus-sys = { path = "../../../firefox-159/third_party/rust/libdbus-sys" }

# Redirect jxl_simd to the in-tree vendored copy so we can carry a patch that
# works around a rust/LLVM issue on macOS/x86_64 that makes jxl-rs decode ~3x
# slower on PGO builds. See bug 2043090.
jxl_simd = { path = "../../../firefox-159/third_party/rust/jxl_simd" }

# gl_generator 0.14.0 + https://github.com/rust-windowing/gl-rs/pull/566

# Implement mach2 0.4 in terms of 0.6
mach2 = { path = "../../../firefox-159/build/rust/mach2" }

[patch."https://github.com/mozilla/nss-rs"]
nss-rs = { path = "../../../firefox-159/third_party/rust/nss-rs" }
